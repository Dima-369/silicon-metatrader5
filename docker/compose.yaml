services:
  siliconmt5:
    build: .
    platform: linux/amd64
    container_name: siliconmt5
    environment:
      - MT5_HOST=0.0.0.0
      - TZ=Europe/Istanbul
      - WINEDEBUG=-all
    ports:
      - 5901:5901
      - 6081:6081
      - 8001:8001
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket,sys;s=socket.socket();s.settimeout(1);rc=s.connect_ex(('127.0.0.1',8001));s.close();sys.exit(0 if rc==0 else 1)\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - wineprefix_persistence:/opt/wineprefix
      - siliconmt5_logs:/siliconmt5/logs
      - /Users/dima/Downloads/mt5setup.exe:/siliconmt5/mt5setup.exe:ro

volumes:
  wineprefix_persistence:
  siliconmt5_logs:
